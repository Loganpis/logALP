[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "logALP"
version = "0.1.0"
description = "Magnetic-field morphology benchmarks for photon-ALP propagation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Loganpis" },
]
keywords = [
  "axion-like particles",
  "photon-ALP propagation",
  "magnetic fields",
  "MHD",
  "Gaussian random fields",
  "astrophysics",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Loganpis/logALP"
Repository = "https://github.com/Loganpis/logALP"
Issues = "https://github.com/Loganpis/logALP/issues"

[project.scripts]
logalp = "logalp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logalp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
